spring:
  datasource:
    url: ${POSTGRES_IT_JDBC_URL}
    username: ${POSTGRES_IT_USERNAME:kylinops}
    password: ${POSTGRES_IT_PASSWORD:kylinops}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 0

app:
  auth:
    enforce-password-change: false
  host-agent:
    shared-token: postgres-it-host-agent-token
  host-task-events:
    redis:
      enabled: false
  screen:
    shared-token: postgres-it-screen-token
  assets:
    avatar-dir: ./target/postgres-it-avatars
    avatar-url-prefix: /uploads/avatars
    assistant-attachment-dir: ./target/postgres-it-assistant-attachments
    assistant-attachment-url-prefix: /uploads/assistant-attachments
