spring:
  datasource:
    url: jdbc:h2:mem:kylinops;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 0

app:
  auth:
    enforce-password-change: false
  agent-runtime:
    worker-id: test-worker
    poll-delay-ms: 60000
  host-agent:
    shared-token: dev-host-agent-token
    running-timeout-seconds: 30
  host-task-events:
    redis:
      enabled: false
  screen:
    shared-token: dev-screen-token
  assets:
    avatar-dir: ./target/test-avatars
    avatar-url-prefix: /uploads/avatars
    assistant-attachment-dir: ./target/test-assistant-attachments
    assistant-attachment-url-prefix: /uploads/assistant-attachments
