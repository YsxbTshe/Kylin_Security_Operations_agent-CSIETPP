spring:
  config:
    import:
      - optional:file:.env.development[.properties]
  datasource:
    url: ${DEV_DB_URL:jdbc:h2:file:./data/dev-db;MODE=PostgreSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    username: ${DEV_DB_USERNAME:sa}
    password: ${DEV_DB_PASSWORD:}
    driver-class-name: ${DEV_DB_DRIVER:org.h2.Driver}
    hikari:
      initialization-fail-timeout: 10000
      connection-timeout: 10000
  jdbc:
    template:
      query-timeout: 5
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${DEV_SERVER_PORT:8080}

app:
  profile:
    mode: dev
  auth:
    enforce-password-change: false
  host-agent:
    shared-token: ${HOST_AGENT_SHARED_TOKEN:dev-host-agent-token}
  host-task-events:
    redis:
      enabled: false
  storage:
    postgres-enabled: false
  screen:
    shared-token: ${SCREEN_SHARED_TOKEN:dev-screen-token}
  rag:
    milvus-enabled: ${RAG_MILVUS_ENABLED:false}
    elasticsearch-enabled: ${RAG_ELASTICSEARCH_ENABLED:false}
    redis-enabled: ${RAG_REDIS_ENABLED:false}
