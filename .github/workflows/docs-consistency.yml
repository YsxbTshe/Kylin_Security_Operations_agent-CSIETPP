# 对外材料一致性门禁。
#
# 检查技术文档的代码引用及已下线能力的描述。
name: docs-consistency

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 脚本只用标准库 + git ls-files，无需安装依赖。
      - name: 文档生成校验回归测试
        run: python3 -m unittest discover -s scripts/tests -v

      - name: 校验证据锚点与对外口径
        run: python3 scripts/verify-doc-consistency.py

      # 解包 Word 文档，直接检查其正文。
      - name: 校验 Word 技术文档正文
        run: bash scripts/export-submission-docx.sh --check
