# 两个前端（admin-web / dashboard-screen）共用的 nginx 配置。
#
# 为什么必须同源反代而不是让前端直连 8080：
#   1. 后端**没有任何 CORS 配置**（src/main/java 里 0 处 cors），跨源请求会被浏览器拦掉；
#   2. admin-web 的 index.html 带 `connect-src 'self'` CSP，只允许打自己这个源；
#   3. 会话 cookie kylin_session 是 SameSite=Lax，跨站不带。
# 所以 /api 与 /uploads 一律由 nginx 转给后端，前端 VITE_API_BASE_URL 保持 /api/v1。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传/下载走后端，可能是大文件，放宽 body 上限（后端自身限 10MiB 制品）。
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端只有在 APP_SECURITY_TRUSTED_PROXY_CIDRS 覆盖本网段时才采信这两个头，
        # 否则审计与登录锁定记录的会是 nginx 的容器 IP。stack.yml 里已把网段写死。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / 长轮询：任务事件流不能被缓冲，否则前端时间线要等到连接关闭才刷新。
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # history 路由（createWebHistory）：深链接必须回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
