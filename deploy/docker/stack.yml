# 应用本体一键栈：PostgreSQL + 后端 + 后台前端 + 数据大屏。
#
#   cd deploy/docker
#   cp stack.env.example .env          # 改掉里面的 token / 密码
#   docker compose -f stack.yml up -d --build
#
# 叠加可观测栈（Grafana/Prometheus/Tempo/OTel）：
#   docker compose -f stack.yml -f observability.yml up -d --build
# 叠加 RAG 依赖（Milvus/ES/Redis，吃内存，按需）：
#   docker compose -f stack.yml -f rag-services.yml up -d --build
# 多文件叠加时 .env 只从**第一个** -f 所在目录（deploy/docker/）读取，三份文件同目录，
# 相对路径与变量插值都不会错位。
#
# ⚠️ 端口冲突：rag-services.yml 的 milvus 占 9091，与本栈的 gRPC 注册端口相同。
# 两者要同时起，请改 HOST_AGENT_GRPC_ENROLL_PORT 或改 milvus 的端口映射。
#
# 不在本栈内的组件：kylin-node-executor / kylin-privhelper / workspace-runner。
# 它们是**被纳管节点上的 systemd 服务**，不是容器（privhelper 要 root、workspace-runner
# 要 rootless Podman、二者都靠 unix socket 与宿主内核交互）。节点侧部署见
# agents/node-executor/deploy/ 与 agents/workspace-runner/deploy/。

name: kylinops

services:
  db:
    # 必须是 pgvector 镜像而不是原版 postgres：FlywayConfig 在识别到 PostgreSQL 时
    # 会自动追加 classpath:db/postgresql，其中 V15_1 要 `create extension vector`，
    # 普通 postgres 镜像上这条会让启动期迁移直接失败。
    image: pgvector/pgvector:pg16
    container_name: kylinops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kylinops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kylinops}
      POSTGRES_DB: ${POSTGRES_DB:-kylinops}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 只绑本机，方便 psql 排查；5434 是为了不撞 rag-local.yml 的 5433 和本机 5432。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kylinops} -d ${POSTGRES_DB:-kylinops}"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ../../services/backend
      dockerfile: ../../deploy/docker/backend.Dockerfile
    image: kylinops-backend:local
    container_name: kylinops-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 仓库里没有 application-prod.yml，application.yml 的 spring.profiles.default 就是 dev，
      # 生产也跑 dev profile（数据源、Flyway 开关都定义在 application-dev.yml 里）。
      # 这里显式写出来，免得看的人以为漏配了。
      SPRING_PROFILES_ACTIVE: dev
      DEV_SERVER_PORT: "8080"
      DEV_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kylinops}
      DEV_DB_USERNAME: ${POSTGRES_USER:-kylinops}
      DEV_DB_PASSWORD: ${POSTGRES_PASSWORD:-kylinops}
      DEV_DB_DRIVER: org.postgresql.Driver
      HOST_AGENT_GRPC_CONTROL_PORT: "9090"
      HOST_AGENT_GRPC_ENROLL_PORT: "9091"
      # 节点注册用的引导 token，与 /etc/kylin-node-executor.env 的 KYLIN_ENROLLMENT_TOKEN 一致。
      HOST_AGENT_SHARED_TOKEN: ${HOST_AGENT_SHARED_TOKEN:-dev-host-agent-token}
      # 大屏 token，与 dashboard-screen 构建参数 VITE_SCREEN_TOKEN 必须一致。
      SCREEN_SHARED_TOKEN: ${SCREEN_SHARED_TOKEN:-dev-screen-token}
      # 审批令牌 SM2 签名材料：值是**文件路径**，PEM 由下面的 ./secrets 挂载提供。
      # 三个变量为空时后端照常启动，直到第一次签发审批令牌才报错——起栈后务必真跑一次审批。
      APPROVAL_SIGNING_KEY_ID: ${APPROVAL_SIGNING_KEY_ID:-approval-1}
      APPROVAL_SIGNING_PRIVATE_KEY_REF: /etc/kylinops/keys/approval-private.pem
      APPROVAL_SIGNING_PUBLIC_KEY_REF: /etc/kylinops/keys/approval.pub
      # nginx 在同一个自定义网段里，声明可信后端才会采信 X-Forwarded-For，
      # 否则审计与登录锁定记录到的全是 nginx 容器 IP。网段见文件末尾 networks。
      APP_SECURITY_TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.31.240.0/24}
      AGENT_RUNTIME_WORKER_ID: ${AGENT_RUNTIME_WORKER_ID:-backend-1}
      STRICT_MODE_ENABLED: ${STRICT_MODE_ENABLED:-false}
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=70}
    volumes:
      # H2 残留、自签 CA（host-agent-certs）、制品与头像目录都在 ./data 下。
      # 丢掉 host-agent-certs 等于把已纳管节点全部踢下线，必须是持久卷。
      - backend-data:/opt/kylinops/backend/data
      # 审批签名密钥：挂**目录**而不是单个文件——挂文件时若宿主机上文件不存在，
      # docker 会默默建一个同名目录，之后报错的现场极难看懂。
      - ./secrets:/etc/kylinops/keys:ro
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:8080"
      # 节点是主动拨入的，这两个端口必须发布到宿主机，否则 Kylin 节点连不上控制面。
      - "${BACKEND_GRPC_CONTROL_PORT:-9090}:9090"
      - "${BACKEND_GRPC_ENROLL_PORT:-9091}:9091"

  admin-web:
    build:
      context: ../../apps/admin-web
      dockerfile: ../../deploy/docker/frontend.Dockerfile
      args:
        # 同源反代：走 nginx 的 /api/v1，不要写成 http://host:8080（后端没有 CORS，
        # 且 admin-web 的 CSP 是 connect-src 'self'）。
        VITE_API_BASE_URL: /api/v1
    image: kylinops-admin-web:local
    container_name: kylinops-admin-web
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ADMIN_HTTP_PORT:-18080}:80"

  dashboard-screen:
    build:
      context: ../../apps/dashboard-screen
      dockerfile: ../../deploy/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        # Vite 变量是构建期内联的：改了 token 必须 --build 重建，重启容器没用。
        VITE_SCREEN_TOKEN: ${SCREEN_SHARED_TOKEN:-dev-screen-token}
        VITE_SCREEN_ORGANIZATION_ID: ${SCREEN_ORGANIZATION_ID:-org-alpha}
    image: kylinops-dashboard-screen:local
    container_name: kylinops-dashboard-screen
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SCREEN_HTTP_PORT:-18081}:80"

volumes:
  db-data:
  backend-data:

networks:
  # 网段写死，好让后端的 APP_SECURITY_TRUSTED_PROXY_CIDRS 有个确定值可填。
  # 若与本机已有网段冲突，改这里和 TRUSTED_PROXY_CIDRS 两处即可。
  default:
    name: kylinops
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.31.240.0/24}
