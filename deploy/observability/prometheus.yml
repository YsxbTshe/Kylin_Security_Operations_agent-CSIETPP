global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    # /actuator 下除 health/info 外都要求携带凭据（AuthTokenInterceptor），
    # 抓取端必须带 token，否则整个 kylin_backend_* 面板全空。
    # 用 credentials_file 而不是内联 credentials：这个 token 是**会过期的登录会话 token**
    # （app_user_session 表里的记录，不是静态密钥），换 token 只需重写文件内容，
    # Prometheus 每次抓取都重新读文件，不必 reload 配置。
    # 文件内容 = 平台登录返回的 token 原文，单行、无 "Bearer " 前缀。
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/backend-scrape-token
    static_configs:
      # 多机部署验证：Ubuntu 控制面的 REST 通过宿主机 18118 转发。
      - targets: ["host.docker.internal:18118"]

  - job_name: host-agent
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:19101"
          - "host.docker.internal:19102"
          - "host.docker.internal:19103"

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]
